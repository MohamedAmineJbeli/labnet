name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  release:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: labnet-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: labnet-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: labnet-macos-x86_64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/labnet
          cp "target/${{ matrix.target }}/release/labnet" dist/labnet/
          cp -r labs dist/labnet/
          cp LICENSE-MIT LICENSE-APACHE README.md dist/labnet/
          tar -czf "${{ matrix.archive }}" -C dist labnet

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/labnet | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/labnet.exe" dist/labnet/
          Copy-Item -Recurse -Path labs -Destination dist/labnet
          Copy-Item -Path LICENSE-MIT, LICENSE-APACHE, README.md -Destination dist/labnet/
          Compress-Archive -Path dist/labnet -DestinationPath "${{ matrix.archive }}"

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}" --clobber