name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: labnet-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: labnet-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: labnet-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/labnet${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          dest="${{ matrix.artifact }}"
          cp "$src" "$dest"

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}